name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        run: dotnet build --configuration Release --nologo

      - name: Test
        run: >
          dotnet test Netezos.Tests
          --no-build
          --configuration Release
          --nologo
          --verbosity normal
          --filter "FullyQualifiedName!~Rpc"
